name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: npm run check
      - name: Trail catalog is up to date
        run: |
          npm run trails
          git diff --exit-code trails/catalog.json
      - name: Service worker precache is up to date
        run: npm run sw:check
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
