name: Draft release

# When main has a version that hasn't been released yet (after merging a
# release PR), keep a draft GitHub Release for it up to date. Publishing the
# draft creates the tag and deploys (see deploy.yml).
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: draft-release
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag is already released, nothing to draft."
            exit 0
          fi
          node scripts/release.mjs notes "$version" > "$RUNNER_TEMP/notes.md"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --draft --target "$GITHUB_SHA" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          echo "Draft release $tag points at $GITHUB_SHA. Publish it to deploy." >> "$GITHUB_STEP_SUMMARY"
